retain_containers: 2

servers:
  web:
    hosts:
      - fizzy-app-01.sc-chi-int.37signals.com: sc_chi
      - fizzy-app-02.sc-chi-int.37signals.com: sc_chi
      - fizzy-app-101.df-iad-int.37signals.com: df_iad
      - fizzy-app-102.df-iad-int.37signals.com: df_iad
      - fizzy-app-401.df-ams-int.37signals.com: df_ams
      - fizzy-app-402.df-ams-int.37signals.com: df_ams
      - fizzy-app-501.sjc-int.37signals.com: sjc
      - fizzy-app-502.sjc-int.37signals.com: sjc
    labels:
      otel_scrape_enabled: true
  jobs:
    hosts:
      - fizzy-jobs-101.df-iad-int.37signals.com: df_iad
      - fizzy-jobs-102.df-iad-int.37signals.com: df_iad
    labels:
      otel_scrape_enabled: true

proxy:
  ssl: false

ssh:
  user: app

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: fatal # suppress unstructured log lines
    MYSQL_DATABASE_HOST: fizzy-mysql-primary
    MYSQL_DATABASE_REPLICA_HOST: fizzy-mysql-replica
    MYSQL_SOLID_CABLE_HOST: fizzy-mysql-primary
    MYSQL_SOLID_QUEUE_HOST: fizzy-mysql-primary
  secret:
    - RAILS_MASTER_KEY
    - MYSQL_ALTER_PASSWORD
    - MYSQL_ALTER_USER
    - MYSQL_APP_PASSWORD
    - MYSQL_APP_USER
    - MYSQL_READONLY_PASSWORD
    - MYSQL_READONLY_USER
    - SECRET_KEY_BASE
    - OAUTH_TOKEN_PEPPER
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - ACTIVE_STORAGE_ACCESS_KEY_ID
    - ACTIVE_STORAGE_SECRET_ACCESS_KEY
    - ACTIVE_STORAGE_DIRECT_UPLOAD_ACCESS_KEY_ID
    - ACTIVE_STORAGE_DIRECT_UPLOAD_SECRET_ACCESS_KEY
    - QUEENBEE_API_TOKEN
    - QUEENBEE_API_TOKEN_PREVIOUS
    - QUEENBEE_SECRET
    - SIGNAL_ID_SECRET
    - SENTRY_DSN
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - STRIPE_MONTHLY_V1_PRICE_ID
    - STRIPE_MONTHLY_EXTRA_STORAGE_V1_PRICE_ID
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    - APNS_KEY_ID
    - APNS_ENCRYPTION_KEY_B64
    - FCM_ENCRYPTION_KEY_B64
    # Directory reviewer sign-in (Identity::ReviewerSignIn). The email is a secret only to keep it out of this public repo.
    - FIZZY_REVIEWER_SIGN_IN_EMAIL
    - FIZZY_REVIEWER_SIGN_IN_CODE_DIGEST
  tags:
    sc_chi:
      MYSQL_SOLID_CACHE_HOST: fizzy-solidcache-db-01.sc-chi-int.37signals.com
    df_iad:
      MYSQL_SOLID_CACHE_HOST: fizzy-solidcache-db-101.df-iad-int.37signals.com
      PRIMARY_DATACENTER: true
    df_ams:
      MYSQL_SOLID_CACHE_HOST: fizzy-solidcache-db-401.df-ams-int.37signals.com
    sjc:
      MYSQL_SOLID_CACHE_HOST: fizzy-solidcache-db-501.sjc-int.37signals.com

accessories:
  load-balancer:
    image: basecamp/kamal-proxy:lb
    hosts:
      - fizzy-lb-101.df-iad-int.37signals.com
      - fizzy-lb-102.df-iad-int.37signals.com
      - fizzy-lb-01.sc-chi-int.37signals.com
      - fizzy-lb-02.sc-chi-int.37signals.com
      - fizzy-lb-401.df-ams-int.37signals.com
      - fizzy-lb-402.df-ams-int.37signals.com
      - fizzy-lb-501.sjc-int.37signals.com
      - fizzy-lb-502.sjc-int.37signals.com
    labels:
      otel_role: load-balancer
      otel_service: fizzy-load-balancer
      otel_scrape_enabled: true
    options:
      publish:
        - 80:80
        - 443:443
      # NFS mount for certificates
      # See https://3.basecamp.com/2914079/buckets/37331921/todos/9180260061
      mount: type=volume,src=certificates,dst=/certificates,volume-driver=local,volume-opt=type=nfs,volume-opt=device=:/fizzy-production-certificates,"volume-opt=o=addr=purestorage.sc-chi-int.37signals.com,nfsvers=3,rw,noatime,nconnect=8,soft,timeo=30,retrans=2"
    volumes:
      - load-balancer:/home/kamal-proxy/.config/kamal-proxy

  # Hosted Fizzy MCP (see saas/config/deploy.yml). On iad's web hosts only, to start: the delegation
  # exchange writes its token on the iad primary and the first API call reads it straight back, and a
  # bearer request carries no session for TransactionPinning to wait on (hosted plan, C, read-after-mint).
  fizzy_mcp:
    hosts:
      - fizzy-app-101.df-iad-int.37signals.com
      - fizzy-app-102.df-iad-int.37signals.com
    proxy:
      host: mcp.fizzy.do
    env:
      clear:
        FIZZY_MCP_RESOURCE_URL: "https://mcp.fizzy.do/mcp"
        # No trailing slash: Fizzy's metadata issuer is the bare origin (#3192), and the server checks.
        FIZZY_MCP_AUTHORIZATION_SERVER: "https://app.fizzy.do"
        FIZZY_MCP_ALLOWED_ORIGINS: "https://app.fizzy.do"
    # TODO: before lighting the exchange, send app.fizzy.do to iad's load balancers so the exchange and
    # every API call stay in iad (iad's LB has write targets only: saas/script/configure-lb-production.sh).
    # options:
    #   add-host:
    #     - "app.fizzy.do:<fizzy-lb-101 address>"
