<%
  raise "The BETA_NUMBER environment variable must be given" unless ENV["BETA_NUMBER"]
  @data = {
    "1" => {
      "hosts" => {
        "web" => ["fizzy-beta-app-101.df-iad-int.37signals.com"],
        "jobs" => ["fizzy-beta-jobs-101.df-iad-int.37signals.com"],
        "lb" => "fizzy-beta-lb-101.df-iad-int.37signals.com"
      },
      "dbs" => {
        "solidqueue" => "fizzy-beta-solidqueue-db-101.df-iad-int.37signals.com"
      }
    }
  }
  @beta_number = ENV["BETA_NUMBER"]
  raise "Beta #{@beta_number} doesn't appear to be defined" unless @data[@beta_number]

  @web_hosts = @data[@beta_number]["hosts"]["web"]
  @job_hosts = @data[@beta_number]["hosts"]["jobs"]
  @lb_host = @data[@beta_number]["hosts"]["lb"]
  @solidqueue_db = @data[@beta_number]["dbs"]["solidqueue"]
%>

retain_containers: 1

servers:
  web:
    hosts:
      - <%= @web_hosts[0] %>: df_iad
    labels:
      otel_scrape_enabled: true

  jobs:
    hosts:
      - <%= @job_hosts[0] %>: df_iad
    labels:
      otel_scrape_enabled: true
    env:
      clear:
        LOG_JOB_MEMORY: "true"

proxy:
  ssl: false

ssh:
  user: app

env:
  clear:
    APP_FQDN: beta<%= @beta_number %>.fizzy-beta.com
    CACHE_NAMESPACE: <%= @beta_number %>
    RAILS_ENV: beta
    RAILS_LOG_LEVEL: fatal # suppress unstructured log lines
    OAUTH_STAFF_ONLY: "true" # OAuth is for 37signals staff until we open it up
<% if @beta_number == "1" %>
    # beta1 is lit for staff (OAUTH_STAFF_ONLY above): OAuth answers, Client ID Metadata Documents are
    # accepted from the allowlisted hosts in deploy.yml, and grants can be audienced to beta1's MCP server.
    OAUTH_ACCEPTANCE_ENABLED: "true"
    OAUTH_CIMD_ENABLED: "true"
    FIZZY_OAUTH_MCP_RESOURCES: "https://beta1-mcp.fizzy-beta.com/mcp"
<% end %>
    MYSQL_DATABASE_HOST: fizzy-mysql-primary
    MYSQL_DATABASE_REPLICA_HOST: fizzy-mysql-replica
    MYSQL_SOLID_CABLE_HOST: fizzy-mysql-primary
    MYSQL_SOLID_QUEUE_HOST: <%= @solidqueue_db %>
    MYSQL_SOLID_CACHE_HOST: fizzy-beta-solidcache-db-101.df-iad-int.37signals.com
  secret:
    - RAILS_MASTER_KEY
    - MYSQL_ALTER_PASSWORD
    - MYSQL_ALTER_USER
    - MYSQL_APP_PASSWORD
    - MYSQL_APP_USER
    - MYSQL_READONLY_PASSWORD
    - MYSQL_READONLY_USER
    - SECRET_KEY_BASE
    - OAUTH_TOKEN_PEPPER
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - ACTIVE_STORAGE_ACCESS_KEY_ID
    - ACTIVE_STORAGE_SECRET_ACCESS_KEY
    - ACTIVE_STORAGE_DIRECT_UPLOAD_ACCESS_KEY_ID
    - ACTIVE_STORAGE_DIRECT_UPLOAD_SECRET_ACCESS_KEY
    - QUEENBEE_API_TOKEN
    - QUEENBEE_API_TOKEN_PREVIOUS
    - QUEENBEE_SECRET
    - SIGNAL_ID_SECRET
    - SENTRY_DSN
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - STRIPE_MONTHLY_V1_PRICE_ID
    - STRIPE_MONTHLY_EXTRA_STORAGE_V1_PRICE_ID
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    - APNS_KEY_ID
    - APNS_ENCRYPTION_KEY_B64
    - FCM_ENCRYPTION_KEY_B64
  tags:
    df_iad:
      PRIMARY_DATACENTER: true

accessories:
  load-balancer:
    # Was `:lb`, a moving tag from before the load-balancer features (read targets, writer
    # affinity) reached a release. Pinned now for the same reason as hotcell's image in
    # deploy.yml: a reboot pulls whatever the tag names at that moment, so a moving tag makes
    # what a host runs depend on when it last rebooted. v0.10.0 is the first release with
    # --client-ip-header, which saas/script/configure-lb-*.sh passes; v0.10.2 adds the AEAD-only
    # TLS 1.2 ciphers and client timeouts on the public listeners.
    image: basecamp/kamal-proxy:v0.10.2
    host: <%= @lb_host %>
    labels:
      otel_role: load-balancer
      otel_service: fizzy-load-balancer
      otel_scrape_enabled: true
    options:
      publish:
        - 80:80
        - 443:443
    volumes:
      - load-balancer:/home/kamal-proxy/.config/kamal-proxy

  # Hosted Fizzy MCP (see saas/config/deploy.yml), on the beta's one web host. A beta shares production's
  # database, and an MCP client fronts exactly one resource, so a beta's exchange needs a client row of its
  # own (fizzy-mcp-server-beta<N>, registered in Oauth::FirstPartyClients), never production's.
  fizzy_mcp:
    host: <%= @web_hosts[0] %>
    proxy:
      host: beta<%= @beta_number %>-mcp.fizzy-beta.com
    env:
      clear:
        FIZZY_MCP_RESOURCE_URL: "https://beta<%= @beta_number %>-mcp.fizzy-beta.com/mcp"
        FIZZY_MCP_AUTHORIZATION_SERVER: "https://beta<%= @beta_number %>.fizzy-beta.com"
        FIZZY_MCP_ALLOWED_ORIGINS: "https://beta<%= @beta_number %>.fizzy-beta.com"
<% if @beta_number == "1" %>
        FIZZY_MCP_EXCHANGE_TOKEN_URL: "https://beta1.fizzy-beta.com/oauth/token"
        FIZZY_MCP_EXCHANGE_CLIENT_ID: "fizzy-mcp-server-beta1"
      secret:
        - FIZZY_MCP_EXCHANGE_CLIENT_SECRET
<% end %>
