<%
  if ENV["MIGRATE"].present?
    mysql_app_user_key = "MYSQL_ALTER_USER"
    mysql_app_password_key = "MYSQL_ALTER_PASSWORD"
    max_execution_time_ms = 0 # No limit
    # INTEGRATION BRANCH ONLY (oauth-integration-2026-10-24), never for main.
    # An ALTER waits for open transactions on its table to finish, and every
    # later query on that table queues behind it. Give up after 2 s instead, so
    # the queue drains; rerun once the blocking transaction is gone.
    # See the 2026-10-24 revision of the runbook on #2296.
    lock_wait_timeout_s = 2
  else
    mysql_app_user_key = "MYSQL_APP_USER"
    mysql_app_password_key = "MYSQL_APP_PASSWORD"
    max_execution_time_ms = 5_000
    lock_wait_timeout_s = nil # The server's
  end

  mysql_app_user = ENV[mysql_app_user_key]
  mysql_app_password = ENV[mysql_app_password_key]

  gem_path = Gem::Specification.find_by_name("fizzy-saas").gem_dir

  # Development and test default to docker-dev's MySQL on 33384, and every
  # checkout of this repo uses the same database names there. A git worktree
  # (where .git is a file) defaulting to it would migrate, purge and reload
  # the main checkout's fizzy_development and fizzy_test, and every other
  # worktree's. So a worktree names its port. FIZZY_DB_PORT=33384 shares
  # docker-dev's databases on purpose.
  local_db_port = ENV.fetch("FIZZY_DB_PORT") do
    if Rails.env.local? && Rails.root.join(".git").file?
      raise "FIZZY_DB_PORT is not set in this git worktree (#{Rails.root}). " \
        "The default, 33384, is docker-dev's MySQL, whose fizzy_development and fizzy_test " \
        "the main checkout and every other worktree share; db:test:prepare here would reset them. " \
        "Set FIZZY_DB_PORT to this worktree's own MySQL, or to 33384 to share docker-dev's on purpose."
    else
      33384
    end
  end
%>

default: &default
  adapter: trilogy
  host: <%= ENV.fetch "FIZZY_DB_HOST", "127.0.0.1" %>
  port: <%= ENV.fetch "FIZZY_DB_PORT", 3306 %>
  pool: 50
  timeout: 5000
  <% unless ENV["MIGRATE"].present? %>
  connect_timeout: 5
  read_timeout: 15
  write_timeout: 15
  <% end %>
  variables:
    transaction_isolation: READ-COMMITTED
    max_execution_time: <%= max_execution_time_ms %>
    <% if lock_wait_timeout_s %>
    lock_wait_timeout: <%= lock_wait_timeout_s %>
    <% end %>

development:
  primary:
    <<: *default
    database: fizzy_development
    port: <%= local_db_port %>
  replica:
    <<: *default
    database: fizzy_development
    port: <%= local_db_port %>
    replica: true
  cable:
    <<: *default
    database: development_cable
    port: <%= local_db_port %>
    migrations_paths: db/cable_migrate
  cache:
    <<: *default
    database: development_cache
    port: <%= local_db_port %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: development_queue
    port: <%= local_db_port %>
    migrations_paths: db/queue_migrate
  saas:
    <<: *default
    database: fizzy_saas_development
    port: <%= local_db_port %>
    migrations_paths: <%= File.join(gem_path, "db", "migrate") %>
    schema_dump: <%= File.join(gem_path, "db", "saas_schema.rb") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: fizzy_test
    port: <%= local_db_port %>
  replica:
    <<: *default
    database: fizzy_test
    port: <%= local_db_port %>
    replica: true
  saas:
    <<: *default
    database: fizzy_saas_test
    port: <%= local_db_port %>
    migrations_paths: <%= File.join(gem_path, "db", "migrate") %>
    schema_dump: <%= File.join(gem_path, "db", "saas_schema.rb") %>

production: &production
  primary:
    <<: *default
    database: fizzy_production
    host: <%= ENV["MYSQL_DATABASE_HOST"] %>
    username: <%= mysql_app_user %>
    password: <%= mysql_app_password %>
  replica:
    <<: *default
    database: fizzy_production
    host: <%= ENV["MYSQL_DATABASE_REPLICA_HOST"] %>
    username: <%= ENV["MYSQL_READONLY_USER"] %>
    password: <%= ENV["MYSQL_READONLY_PASSWORD"] %>
    replica: true
  cable:
    <<: *default
    database: fizzy_solidcable_production
    host: <%= ENV["MYSQL_SOLID_CABLE_HOST"] %>
    username: <%= mysql_app_user %>
    password: <%= mysql_app_password %>
    migrations_paths: db/cable_migrate
  queue:
    <<: *default
    database: fizzy_solidqueue_production
    host: <%= ENV["MYSQL_SOLID_QUEUE_HOST"] %>
    username: <%= mysql_app_user %>
    password: <%= mysql_app_password %>
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
    database: fizzy_solidcache_production
    host: <%= ENV["MYSQL_SOLID_CACHE_HOST"] %>
    username: <%= mysql_app_user %>
    password: <%= mysql_app_password %>
    migrations_paths: db/cache_migrate
    <% unless ENV["MIGRATE"].present? %>
    connect_timeout: 1
    read_timeout: 1
    write_timeout: 1
    <% end %>
  saas:
    <<: *default
    database: fizzy_saas_production
    host: <%= ENV["MYSQL_DATABASE_HOST"] %>
    username: <%= mysql_app_user %>
    password: <%= mysql_app_password %>
    migrations_paths: <%= File.join(gem_path, "db", "migrate") %>
    schema_dump: <%= File.join(gem_path, "db", "saas_schema.rb") %>

beta: *production
staging: *production
