name: Sync Gemfile.saas.lock

on:
  push:
    branches:
      - "dependabot/bundler/**"
    paths:
      - Gemfile.lock

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] -- credentials needed for git push # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version

      - name: Forward Gemfile.lock changes to Gemfile.saas.lock
        run: bin/bundle-drift forward

      - name: Commit updated lockfile
        run: |
          git add Gemfile.saas.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync Gemfile.saas.lock"
            git push
          fi
