name: CI (SaaS)

on:
  push:

permissions:
  contents: read

jobs:
  test_oss:
    name: Test (OSS)
    uses: ./.github/workflows/test.yml
    with:
      saas: false
  test_saas:
    name: Test (SaaS)
    uses: ./.github/workflows/test.yml
    with:
      saas: true
    secrets:
      FIZZY_GH_TOKEN: ${{ secrets.FIZZY_GH_TOKEN }}

  # Appends one record per main commit to the orphan `metrics` branch, from whichever test
  # legs produced numbers. See docs/code-health-metrics.md.
  #
  # It waits for both legs but requires only one to have passed. A leg that failed uploads
  # no artifact -- its `coverage` job never runs -- so a broken suite cannot contribute a
  # number either way, and demanding both would mean a fork that cannot run the private
  # SaaS gems never records anything at all. That is the case in every fork of this repo,
  # so the stricter rule would have made the whole thing dead code outside Basecamp.
  #
  # The push uses GITHUB_TOKEN, which by design does not trigger workflows, so writing the
  # branch cannot start another build.
  metrics:
    name: Record code health metrics
    needs: [ test_oss, test_saas ]
    if: >-
      always() && github.ref == 'refs/heads/main'
      && (needs.test_oss.result == 'success' || needs.test_saas.result == 'success')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Credentials are kept on purpose: pushing the metrics branch is this job's only job.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true # zizmor: ignore[artipacked]

      # bin/metrics is stdlib-only, so no bundle install.
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: .ruby-version

      - name: Download collected metrics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: metrics-*
          path: tmp/metrics

      - name: Append to the metrics branch
        run: bin/metrics record

      - name: Add metrics summary
        run: |
          echo '```'      >> "$GITHUB_STEP_SUMMARY"
          bin/metrics trend >> "$GITHUB_STEP_SUMMARY"
          echo '```'      >> "$GITHUB_STEP_SUMMARY"
