[termination]
# Hard ceiling for a solve. Rails cancels at the board's own planning budget,
# which is the value an admin actually configures.
seconds_spent_limit = 90

[[phases]]
type = "construction_heuristic"
construction_heuristic_type = "cheapest_insertion"
construction_obligation = "assign_when_candidate_exists"

[[phases]]
type = "local_search"

# Stop once the score stops improving so small boards return in a couple of
# seconds instead of spending the whole budget. This must live on the phase:
# a phase termination replaces the top-level one while the phase runs.
[phases.termination]
unimproved_seconds_spent_limit = 2

[phases.move_selector]
type = "union_move_selector"
selection_order = "round_robin"

[[phases.move_selector.selectors]]
type = "change_move_selector"
entity_class = "Task"
variable_name = "person_idx"

[[phases.move_selector.selectors]]
type = "swap_move_selector"
entity_class = "Task"
variable_name = "person_idx"
