default: &default
  adapter: sqlite3
  pool: 5
  timeout: 5000
  pragmas:
    # WAL mode allows concurrent reads + writes without blocking each other.
    # Critical for multi-process Puma + Solid Queue deployments.
    journal_mode: wal
    # NORMAL is safe with WAL mode and significantly faster than FULL.
    synchronous: normal
    # 128MB memory-mapped I/O for read-heavy workloads.
    mmap_size: 134217728
    # Cap WAL file at 64MB to prevent unbounded growth.
    journal_size_limit: 67108864
    # 2MB page cache (negative = KB).
    cache_size: -2000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
    schema_dump: schema_sqlite.rb
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

test:
  primary:
    <<: *default
    database: storage/test.sqlite3
    schema_dump: schema_sqlite.rb
  cable:
    <<: *default
    database: storage/test_cable.sqlite3
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    database: storage/production.sqlite3
    schema_dump: schema_sqlite.rb
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
